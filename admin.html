
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf8f0">
  <title>لوحة تحكم التهاني - المهندس محمد والآنسة ميرنا</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">

  <style>
    body {
      min-height: 100vh;
      padding: 35px 15px;
    }

    .admin-container {
      position: relative;
      z-index: 2;
      max-width: 700px;
      margin: auto;
    }

    .admin-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(99,68,127,.07);
    }

    .admin-title {
      text-align: center;
      font-size: 25px;
      color: var(--purple-dark);
      margin-bottom: 20px;
    }

    .admin-form {
      display: grid;
      gap: 12px;
    }

    .admin-form input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
    }

    .admin-form input:focus {
      border-color: var(--purple);
    }

    .admin-message {
      background: #fbf8f0;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-top: 13px;
    }

    .admin-message p {
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .admin-message small {
      color: var(--muted);
    }

    .admin-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .delete-button {
      border: 1px solid #d77b7b;
      color: #a94444;
      background: white;
      padding: 7px 13px;
      border-radius: 20px;
      cursor: pointer;
    }

    .admin-status {
      color: var(--purple-dark);
      text-align: center;
      margin: 15px 0;
      font-size: 13px;
    }

    .admin-hidden {
      display: none !important;
    }

    .admin-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .admin-header p {
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="admin-container">

    <header class="admin-header">
      <h1 class="admin-title">المهندس محمد والآنسة ميرنا 🤍</h1>
      <p>لوحة إدارة تهاني حفل الزفاف</p>
    </header>

    <section class="admin-card" id="loginSection">

      <h2 class="admin-title">تسجيل دخول الإدارة</h2>

      <form class="admin-form" id="loginForm">

        <input
          type="email"
          id="adminEmail"
          placeholder="البريد الإلكتروني"
          autocomplete="username"
          required
        >

        <input
          type="password"
          id="adminPassword"
          placeholder="كلمة المرور"
          autocomplete="current-password"
          required
        >

        <button class="gold-button" type="submit">
          تسجيل الدخول
        </button>

      </form>

      <p class="admin-status" id="loginStatus"></p>

    </section>

    <section id="dashboard" class="admin-hidden">

      <div class="admin-card">

        <div class="admin-actions">
          <h2>التهاني المستلمة</h2>

          <button class="gold-button" id="logoutButton">
            تسجيل الخروج
          </button>
        </div>

        <h1 id="messageCount">0</h1>
        <p>إجمالي الرسائل</p>

        <button class="gold-button" id="refreshButton">
          تحديث التهاني
        </button>

        <p class="admin-status" id="dashboardStatus"></p>

      </div>

      <div class="admin-card">

        <h2>قائمة التهاني</h2>

        <div id="messagesList"></div>

      </div>

    </section>

  </div>

  <script type="module" src="./admin.js"></script>

</body>
</html>
